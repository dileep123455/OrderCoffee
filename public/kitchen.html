<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make Your Coffee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><strong>&#9749; Brew Your Way</strong><a href="kitchen.html"><button>Staff Access</button></a></header>
<main>
  <section id="orderSection" class="card">
    <h2>Make your coffee</h2>
    <label for="name">Your name</label>
    <input type="text" id="name" maxlength="40">
    <label for="table">Table number (1-50)</label>
    <input type="number" id="table" min="1" max="50">
    <label for="coffee">Coffee type</label>
    <select id="coffee"></select>
    <label>Milk: <span class="val" id="milkVal">0</span> ml</label>
    <input type="range" id="milk" min="0" max="300" step="10" value="100">
    <label>Water: <span class="val" id="waterVal">0</span> ml</label>
    <input type="range" id="water" min="0" max="300" step="10" value="50">
    <label>Sugar: <span class="val" id="sugarVal">0</span> spoon(s)</label>
    <input type="range" id="sugar" min="0" max="10" step="1" value="1">
    <label>Extras (spice &amp; more)</label>
    <div class="extras" id="extras"></div>
    <label for="notes">Special notes (optional)</label>
    <textarea id="notes" rows="2" maxlength="200"></textarea>
    <p><strong>Total: &#8377;<span id="total">0</span></strong></p>
    <button class="full" id="submit">Place order</button>
    <div class="error" id="error"></div>
  </section>

  <section id="trackSection" class="card hidden">
    <h2>Order <span id="orderId"></span></h2>
    <p id="summary"></p>
    <div class="steps" id="steps"></div>
    <p id="statusMsg"></p>
    <button class="alt" id="newOrder">Order another</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
